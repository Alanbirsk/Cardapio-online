<script>
    // ===== SEGURANÇA =====
    const SALT = "aquarius_salt_2024";
    function hashPassword(pwd){return CryptoJS.SHA256(pwd+SALT).toString();}
    const auth = sessionStorage.getItem('aquarius_kitchen_auth');
    if (!auth) {
        const p = prompt('Senha da cozinha:');
        if (!p || hashPassword(p) !== hashPassword('cozinha123')) {
            alert('Acesso negado!'); window.close();
        } else {
            sessionStorage.setItem('aquarius_kitchen_auth', '1');
        }
    }

    // ===== NOTIFICAÇÕES =====
    let notificationPermission = false;
    async function requestNotificationPermission() {
        if (!('Notification' in window)) {
            console.log('🔕 Notificações não suportadas.');
            return false;
        }
        if (Notification.permission === 'granted') {
            notificationPermission = true;
            console.log('🔔 Notificações permitidas.');
            return true;
        }
        if (Notification.permission === 'denied') {
            console.log('🔕 Notificações bloqueadas.');
            return false;
        }
        const result = await Notification.requestPermission();
        notificationPermission = result === 'granted';
        console.log(notificationPermission ? '🔔 Notificações ativadas!' : '🔕 Notificações recusadas.');
        return notificationPermission;
    }

    function sendNotification(title, body, icon) {
        if (!notificationPermission) return;
        try {
            const notif = new Notification(title, {
                body: body,
                icon: icon || 'https://via.placeholder.com/128x128/22c55e/fff?text=🍔',
                tag: 'new-order',
                requireInteraction: true,
                silent: true // silencioso porque o som já é tocado separadamente
            });
            // Fecha automaticamente após 8 segundos
            setTimeout(() => notif.close(), 8000);
            // Atualiza badge no título
            updateTitleBadge();
        } catch(e) { console.warn('Erro na notificação:', e); }
    }

    let notifCount = 0;
    function updateTitleBadge() {
        const badge = document.getElementById('notifBadge');
        if (!badge) return;
        if (notifCount > 0) {
            badge.textContent = notifCount;
            badge.style.display = 'inline-block';
            document.title = `(${notifCount}) Aquarius - Cozinha`;
        } else {
            badge.style.display = 'none';
            document.title = 'Aquarius - Cozinha';
        }
    }

    // ===== VARIÁVEIS =====
    let orders=[], selId=null, fil='pendente', snd=true, newIds=new Set(), alertInt=null, isOnline=true, firebaseReady=false, unsubscribeOrders=null, pollCount=0;
    let timerInterval=null, historyOrders=[], historyUnsubscribe=null;
    let filtroTipo='todos', filtroStatus='todos';
    let lastKnownOrderIds = new Set();

    // ===== TEMA =====
    function toggleTheme(){
        const html=document.documentElement;
        const current=html.getAttribute('data-theme');
        const next=current==='dark'?'light':'dark';
        html.setAttribute('data-theme',next);
        document.getElementById('themeToggle').textContent=next==='dark'?'🌙':'☀️';
        localStorage.setItem('kitchen_theme',next);
    }
    (function(){
        const saved=localStorage.getItem('kitchen_theme')||'dark';
        document.documentElement.setAttribute('data-theme',saved);
        document.getElementById('themeToggle').textContent=saved==='dark'?'🌙':'☀️';
    })();

    // ===== FUNÇÕES BÁSICAS =====
    function updClock(){document.getElementById('clock').textContent=new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}
    setInterval(updClock,1000);updClock();
    function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2000)}
    function updatePollCounter(){pollCount++;document.getElementById('pollCount').textContent=pollCount;}

    async function setOnline(online){isOnline=online;try{await window.fsSet(window.fsDoc(window.db,"status_cozinha","online"),{online,ultimaAtualizacao:new Date().toISOString()},{merge:true})}catch(e){await window.fsSet(window.fsDoc(window.db,"status_cozinha","online"),{online,ultimaAtualizacao:new Date().toISOString()})}updateOnlineUI();toast(online?'🟢 ONLINE!':'🔴 OFFLINE!')}
    function updateOnlineUI(){const cs=document.getElementById('connectionStatus'),st=document.getElementById('statusText'),btnOn=document.getElementById('btnOnline'),btnOff=document.getElementById('btnOffline');if(isOnline){cs.classList.remove('offline');st.textContent='Online';btnOn.style.display='none';btnOff.style.display='inline-block'}else{cs.classList.add('offline');st.textContent='Offline';btnOn.style.display='inline-block';btnOff.style.display='none'}}
    
    function forceReload(){
        toast('🔄 Recarregando...');
        if(unsubscribeOrders)unsubscribeOrders();
        firebaseReady=false;
        orders=[];newIds.clear();
        setTimeout(initKitchen,300);
    }

    // ===== SOM =====
    function playBellSound(){
        if(!snd)return;
        try{
            const ctx=new(window.AudioContext||window.webkitAudioContext)();
            const freq=[800,1000,1200,1000,800];
            const dur=[0.08,0.08,0.08,0.08,0.12];
            freq.forEach((f,i)=>{
                const osc=ctx.createOscillator();
                const gain=ctx.createGain();
                osc.connect(gain);gain.connect(ctx.destination);
                osc.type='sine';
                osc.frequency.value=f;
                gain.gain.setValueAtTime(0.15,ctx.currentTime+i*0.08);
                gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+i*0.08+dur[i]);
                osc.start(ctx.currentTime+i*0.08);
                osc.stop(ctx.currentTime+i*0.08+dur[i]);
            });
        }catch(e){}
    }

    function toggleSound(){snd=!snd;const btn=document.getElementById('sndBtn');if(snd){btn.textContent='🔊';btn.classList.remove('muted');if(newIds.size>0||hasAtrasados())startAlertInterval();toast('🔊 Som ativado')}else{btn.textContent='🔇';btn.classList.add('muted');stopAlertInterval();toast('🔇 Som desativado')}}
    
    function hasAtrasados(){return orders.some(o=>o.status!=='finalizado'&&o.status!=='cancelado'&&isAtrasado(o))}
    function isAtrasado(o){const estimado=o.tipoEntrega==='entrega'?50:35;const criacao=new Date(o.dataHora).getTime();return (Date.now()-criacao)/60000>estimado}
    
    function startAlertInterval(){if(alertInt)return;if(!snd)return;playBellSound();alertInt=setInterval(()=>{if(newIds.size===0&&!hasAtrasados()){stopAlertInterval();return}playBellSound()},4000)}
    function stopAlertInterval(){if(alertInt){clearInterval(alertInt);alertInt=null}}
    
    async function logout(){if(confirm('Sair? Cozinha ficará OFFLINE.')){await setOnline(false);sessionStorage.removeItem('aquarius_kitchen_auth');window.close()}}

    // ===== INICIALIZAÇÃO =====
    function initKitchen(){
        if(!window.db){setTimeout(initKitchen,500);return}
        if(firebaseReady)return;
        firebaseReady=true;
        if(unsubscribeOrders)unsubscribeOrders();

        const q=window.fsQ(window.fsColl(window.db,"pedidos_ativos"),window.fsOB("dataHora","desc"));
        unsubscribeOrders=window.fsSnap(q,
            (snap)=>{
                updatePollCounter();
                const oi=new Set(orders.map(o=>o.id));
                const newOrderIds = new Set();
                orders=[];
                snap.forEach(d=>{
                    const data=d.data();
                    if(!data.dataHora) data.dataHora=new Date().toISOString();
                    orders.push({id:d.id,...data});
                    newOrderIds.add(d.id);
                });
                // Verifica novos pedidos (que não estavam na lista anterior)
                const nw = orders.filter(o => !oi.has(o.id) && o.status === 'pendente');
                nw.forEach(o => {
                    newIds.add(o.id);
                    // 🔔 ENVIA NOTIFICAÇÃO
                    const cliente = o.cliente || 'Cliente';
                    const total = parseFloat(o.total || 0).toFixed(2);
                    const itens = o.itens ? o.itens.map(i => `${i.qtd}x ${i.nome}`).join(', ') : '';
                    sendNotification(
                        `🍔 Novo Pedido #${o.numeroPedido || o.id.substring(0,6)}`,
                        `${cliente} - R$ ${total}${itens ? '\n' + itens : ''}`,
                        'https://via.placeholder.com/128x128/22c55e/fff?text=🍔'
                    );
                    notifCount++;
                    updateTitleBadge();
                    playBellSound(); // toca som junto com a notificação
                });
                updAlert();applyFilters();startTimers();
                if(selId&&!orders.find(o=>o.id===selId)){selId=null;renderDetail()}
                else if(selId)renderDetail();
                loadHistory();
                // Atualiza último conjunto conhecido
                lastKnownOrderIds = newOrderIds;
            },
            (err)=>{
                console.error("❌ Erro no snapshot:", err);
                firebaseReady=false;
                setTimeout(initKitchen,3000);
                toast("❌ Erro ao carregar pedidos. Reconectando...");
            }
        );
        const statusRef=window.fsDoc(window.db,"status_cozinha","online");
        window.fsSnap(statusRef,(snap)=>{updatePollCounter();if(snap.exists()){isOnline=snap.data().online!==false;updateOnlineUI()}});
    }

    // ===== HISTÓRICO =====
    function loadHistory(){
        if(historyUnsubscribe)historyUnsubscribe();
        const periodo=parseInt(document.getElementById('histFilterPeriodo').value)||0;
        const dataInicio=document.getElementById('histDataInicio').value;
        const dataFim=document.getElementById('histDataFim').value;
        const statusFiltro=document.getElementById('histFilterStatus').value;

        let constraints=[window.fsWhere("status","in",["finalizado","cancelado"])];
        if(periodo>0){
            const dataLimite=new Date(Date.now()-periodo*86400000);
            constraints.push(window.fsWhere("dataHora",">=",dataLimite.toISOString()));
        }
        if(dataInicio){
            constraints.push(window.fsWhere("dataHora",">=",new Date(dataInicio+'T00:00:00').toISOString()));
        }
        if(dataFim){
            const fim=new Date(dataFim+'T23:59:59');
            constraints.push(window.fsWhere("dataHora","<=",fim.toISOString()));
        }
        if(statusFiltro!=='todos'){
            constraints.push(window.fsWhere("status","==",statusFiltro));
        }
        const q=window.fsQ(window.fsColl(window.db,"pedidos_ativos"),...constraints,window.fsOB("dataHora","desc"),window.fsLim(200));
        historyUnsubscribe=window.fsSnap(q,(snap)=>{
            historyOrders=[];snap.forEach(d=>historyOrders.push({id:d.id,...d.data()}));
            renderHistory();
        },()=>{});
    }
    function renderHistory(){
        const div=document.getElementById('historyList');
        if(!historyOrders.length){div.innerHTML='<p style="color:var(--tm);text-align:center;">Nenhum pedido encontrado.</p>';return}
        let h='';
        historyOrders.forEach(o=>{
            const d=new Date(o.dataHora);
            const statusClass=o.status==='finalizado'?'finalizado':'cancelado';
            h+=`<div class="hist-item">
                <div><strong>#${o.numeroPedido||o.id.substring(0,6)}</strong> - ${o.cliente||'N/A'}</div>
                <div><span class="h-date">${d.toLocaleDateString('pt-BR')} ${d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}</span></div>
                <div class="h-total">R$ ${parseFloat(o.total||0).toFixed(2)}</div>
                <span class="h-status ${statusClass}">${o.status==='finalizado'?'✅ Finalizado':'❌ Cancelado'}</span>
            </div>`;
        });
        div.innerHTML=h;
    }
    function toggleHistory(){
        const panel=document.getElementById('historyPanel');
        panel.classList.toggle('show');
        if(panel.classList.contains('show')) loadHistory();
    }

    // ===== MÉTRICAS =====
    function calcMetrics(){
        const active=orders.filter(o=>o.status!=='finalizado'&&o.status!=='cancelado');
        const total=active.length;
        const atrasados=active.filter(isAtrasado).length;
        const noPrazo=total-atrasados;
        const finalized=orders.filter(o=>o.status==='finalizado'&&o.horaPreparo&&o.dataHora);
        let avgPrep=0;
        if(finalized.length){
            const totalMin=finalized.reduce((acc,o)=>{
                const start=new Date(o.dataHora).getTime();
                const prep=new Date(o.horaPreparo).getTime();
                return acc+(prep-start)/60000;
            },0);
            avgPrep=totalMin/finalized.length;
        }
        return {total,atrasados,noPrazo,avgPrep};
    }
    function renderMetrics(){
        const m=calcMetrics();
        const detail=document.getElementById('detail');
        let metricsDiv=detail.querySelector('.metrics');
        if(!metricsDiv){
            metricsDiv=document.createElement('div');
            metricsDiv.className='metrics';
            detail.prepend(metricsDiv);
        }
        metricsDiv.innerHTML=`
            <div class="metric"><div class="metric-value" style="color:#22c55e;">${m.total}</div><div class="metric-label">Ativos</div></div>
            <div class="metric"><div class="metric-value" style="color:#f59e0b;">${m.noPrazo}</div><div class="metric-label">No Prazo</div></div>
            <div class="metric"><div class="metric-value" style="color:#ef4444;">${m.atrasados}</div><div class="metric-label">Atrasados</div></div>
            <div class="metric"><div class="metric-value" style="color:#3b82f6;">${m.avgPrep.toFixed(1)}min</div><div class="metric-label">Tempo Médio</div></div>
        `;
    }

    // ===== FILTROS =====
    function applyFilters(){
        filtroTipo=document.getElementById('filterTipo').value;
        filtroStatus=document.getElementById('filterStatus').value;
        renderOrders();
    }

    // ===== RENDER =====
    function updAlert(){for(let id of newIds){if(!orders.find(o=>o.id===id&&o.status==='pendente'))newIds.delete(id)}const b=document.getElementById('alertBadge'),c=document.getElementById('newCount'),dot=document.getElementById('pendingDot');c.textContent=newIds.size;if(dot)dot.classList.toggle('show',newIds.size>0);if((newIds.size>0||hasAtrasados())&&isOnline){b.classList.add('show');startAlertInterval()}else{b.classList.remove('show');stopAlertInterval()}}
    function focusNew(){fil='pendente';document.getElementById('filterStatus').value='todos';updTabs();applyFilters()}
    function filter(s){fil=s;document.getElementById('filterStatus').value=s;updTabs();applyFilters()}
    function updTabs(){['P','Pr','R'].forEach(s=>{const t=document.getElementById('tab'+s);if(t)t.classList.toggle('active',fil===(s==='P'?'pendente':s==='Pr'?'preparando':'pronto'))})}

    function getTimeRemaining(o){
        const estimado=o.tipoEntrega==='entrega'?50:35;
        const criacao=new Date(o.dataHora).getTime();
        const decorrido=(Date.now()-criacao)/60000;
        const restante=Math.max(0,estimado-decorrido);
        const mins=Math.floor(restante), segs=Math.floor((restante-mins)*60);
        return {mins,segs,atrasado:decorrido>estimado,decorrido};
    }

    function startTimers(){
        if(timerInterval)clearInterval(timerInterval);
        timerInterval=setInterval(()=>{renderOrders();if(selId)renderDetail();updAlert();renderMetrics()},1000);
    }

    function renderOrders(){
        let fl=orders.filter(o=>o.status!=='finalizado'&&o.status!=='cancelado');
        if(filtroStatus!=='todos') fl=fl.filter(o=>o.status===filtroStatus);
        if(filtroTipo!=='todos') fl=fl.filter(o=>o.tipoEntrega===filtroTipo);
        if(fil==='pendente') fl=fl.filter(o=>o.status==='pendente');
        else if(fil==='preparando') fl=fl.filter(o=>o.status==='preparando'||o.status==='confirmado');
        else if(fil==='pronto') fl=fl.filter(o=>o.status==='pronto');

        document.getElementById('statP').textContent=orders.filter(o=>o.status==='pendente').length;
        document.getElementById('statPr').textContent=orders.filter(o=>o.status==='preparando'||o.status==='confirmado').length;
        document.getElementById('statR').textContent=orders.filter(o=>o.status==='pronto').length;

        let h='';
        fl.forEach(o=>{
            const nw=newIds.has(o.id);
            const atrasado=isAtrasado(o);
            const timer=getTimeRemaining(o);
            const timerLabel=atrasado?'🔴 Atrasado!':`${timer.mins.toString().padStart(2,'0')}:${timer.segs.toString().padStart(2,'0')}`;
            const timerClass=atrasado?'red':(timer.mins<10?'yellow':'green');
            h+=`<div class="oc${o.id===selId?' selected':''}${nw?' new':''}${atrasado?' atrasado':''}" onclick="select('${o.id}')">
                <div class="oh"><span class="on">#${o.numeroPedido||o.id.substring(0,6)}${atrasado?' 🔴':''}</span><span class="ot">${o.dataHora?new Date(o.dataHora).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}):''}</span></div>
                <div class="ocl">${o.cliente||'N/A'}</div>
                <div class="oi"><span>${o.itens?o.itens.length:0} itens</span><span class="oto">R$ ${parseFloat(o.total||0).toFixed(2)}</span></div>
                <div class="timer ${timerClass}">⏱️ ${timerLabel}</div>
            </div>`;
        });
        document.getElementById('ordersList').innerHTML=h||'<div style="text-align:center;color:var(--tm);padding:30px;">Nenhum pedido ativo</div>';
        renderMetrics();
    }

    function select(id){selId=id;const o=orders.find(x=>x.id===id);if(o&&o.status==='pendente'){newIds.delete(id);updAlert()}renderOrders();renderDetail()}

    // ===== IMPRESSÃO =====

        let html=`
        <div id="print-area" style="display:block;">
            <div class="order-header">🍔 AQUARIUS BURGUER</div>

            <div class="order-info"><strong>Pagamento:</strong> ${o.formaPagamento||'N/A'} ${o.troco?`| Troco R$ ${parseFloat(o.troco).toFixed(2)}`:''}</div>

        if(o.adicionais&&o.adicionais.length){

        setTimeout(()=>{window.print();setTimeout(()=>{printArea.style.display='none';printArea.innerHTML=''},500)},100);
    }

            ${o.status==='pronto'?`<button class="ab ab-finish" onclick="updStatus('${o.id}','finalizado')">🎉 Finalizar</button>`:''}
            ${o.telefone?`<button class="ab ab-wa" onclick="sendWA('${o.id}')">💬 WhatsApp</button>`:''}
            <button class="ab ab-print" onclick="printOrder('${o.id}')">🖨️ Imprimir</button>
            <button class="ab ab-cancel" onclick="cancelOrd('${o.id}')">❌ Cancelar</button>
        </div>`;
        renderMetrics();
    }

    // ===== STATUS =====
    async function updStatus(oid,ns){
        try{
            const d={status:ns,ultimaAtualizacao:new Date().toISOString()};
            if(ns==='preparando')d.horaPreparo=new Date().toISOString();
            else if(ns==='pronto'){
                d.horaPronto=new Date().toISOString();
                if(confirm('🖨️ Deseja imprimir o pedido para o entregador agora?')){
                    printOrder(oid);
                }
            }
            await window.fsUpd(window.fsDoc(window.db,"pedidos_ativos",oid),d);
            if(ns==='finalizado'){selId=null;renderDetail()}
            toast('✅ Status atualizado!');
        }catch(e){alert('Erro: '+e.message)}
    }

    function sendWA(oid){const o=orders.find(x=>x.id===oid);if(!o||!o.telefone)return;const sm={pendente:'⏳ Em processamento',confirmado:'✅ Confirmado!',preparando:'👨‍🍳 Em preparo',pronto:'🎯 Pronto! '+(o.tipoEntrega==='entrega'?'Saindo para entrega':'Retire no balcão'),finalizado:'🎉 Finalizado'};let m='🍔 *AQUARIUS BURGUER*\n\nOlá *'+o.cliente+'*! 👋\n\nPedido *#'+(o.numeroPedido||o.id.substring(0,6))+'*\n'+(sm[o.status]||'')+'\n\n📋 *Itens:*\n';if(o.itens)o.itens.forEach(i=>m+='• '+i.qtd+'x '+i.nome+'\n');if(o.adicionais&&o.adicionais.length>0){m+='\n🍟 *Adicionais:*\n';o.adicionais.forEach(a=>m+='• '+a.nome+' +R$ '+parseFloat(a.preco).toFixed(2)+'\n')}m+='\n💰 Total: R$ '+parseFloat(o.total||0).toFixed(2)+'\n💳 '+(o.formaPagamento||'');if(o.endereco)m+='\n📍 Entrega: '+o.endereco;window.open('https://wa.me/55'+o.telefone.replace(/\D/g,'')+'?text='+encodeURIComponent(m))}
    async function cancelOrd(oid){if(!confirm('Cancelar este pedido?'))return;try{await window.fsUpd(window.fsDoc(window.db,"pedidos_ativos",oid),{status:'cancelado',ultimaAtualizacao:new Date().toISOString()});newIds.delete(oid);updAlert();if(selId===oid){selId=null;renderDetail()}toast('❌ Cancelado!')}catch(e){alert('Erro: '+e.message)}}

    // ===== INICIALIZAÇÃO =====
    // Solicita permissão para notificações ao carregar
    requestNotificationPermission();

    window.initKitchen=initKitchen;updateOnlineUI();
    window.addEventListener('beforeunload',()=>{if(isOnline)setOnline(false)});
</script>
</body>
</html>
